    <script>
        let currentInput = "0";
        let expressionHistory = "";
        let angleMode = "DEG"; // DEG or RAD
        let memoryValue = 0;
        let soundEnabled = false;
        let currentTheme = "amber"; // amber or green
        let scanlinesEnabled = true;
        let historyTape = [];

        // Synthesizer setup for mechanical click sounds
        let synth = null;
        function initSound() {
            if (!synth) {
                synth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.003, decay: 0.03, sustain: 0, release: 0.03 }
                }).toDestination();
                synth.volume.value = -12;
            }
        }

        function playClickSound() {
            if (soundEnabled) {
                initSound();
                try {
                    Tone.start();
                    synth.triggerAttackRelease("G4", "32n");
                } catch(e) {
                    console.log("Audio waiting for user gesture", e);
                }
            }
        }

        // Sound Toggle
        document.getElementById('soundToggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundStatus').innerText = soundEnabled ? "ON" : "OFF";
            document.getElementById('soundStatus').className = soundEnabled ? "text-emerald-400 font-bold" : "text-zinc-400";
            if (soundEnabled) initSound();
            playClickSound();
        });

        // Scanlines Toggle
        document.getElementById('scanlineToggle').addEventListener('click', () => {
            playClickSound();
            scanlinesEnabled = !scanlinesEnabled;
            const lcd = document.getElementById('lcdDisplay');
            const statusSpan = document.getElementById('scanlineStatus');
            if (scanlinesEnabled) {
                lcd.classList.add('scanlines');
                statusSpan.innerText = "ON";
                statusSpan.className = "text-emerald-400 font-bold";
            } else {
                lcd.classList.remove('scanlines');
                statusSpan.innerText = "OFF";
                statusSpan.className = "text-zinc-400";
            }
        });

        // Theme Toggle (Amber vs Green LCD Phosphor)
        document.getElementById('themeToggle').addEventListener('click', () => {
            playClickSound();
            const lcd = document.getElementById('lcdDisplay');
            const themeNameSpan = document.getElementById('themeName');
            if (currentTheme === "amber") {
                currentTheme = "green";
                lcd.classList.remove('amber');
                themeNameSpan.innerText = "Verde";
                themeNameSpan.className = "text-emerald-400 font-bold";
            } else {
                currentTheme = "amber";
                lcd.classList.add('amber');
                themeNameSpan.innerText = "Âmbar";
                themeNameSpan.className = "text-amber-400 font-bold";
            }
        });

        function setAngleMode(mode) {
            playClickSound();
            angleMode = mode;
            document.getElementById('angleModeDisp').innerText = mode;
            if (mode === 'DEG') {
                document.getElementById('btnDeg').className = "py-1 bg-zinc-800 text-amber-400 font-bold border border-zinc-700 rounded transition shadow";
                document.getElementById('btnRad').className = "py-1 bg-zinc-800 text-zinc-400 border border-zinc-700 rounded transition shadow";
            } else {
                document.getElementById('btnRad').className = "py-1 bg-zinc-800 text-amber-400 font-bold border border-zinc-700 rounded transition shadow";
                document.getElementById('btnDeg').className = "py-1 bg-zinc-800 text-zinc-400 border border-zinc-700 rounded transition shadow";
            }
        }

        function updateDisplay() {
            document.getElementById('mainOutput').innerText = currentInput;
            document.getElementById('historyExpression').innerText = expressionHistory;
            document.getElementById('memIndicator').innerText = `MEM: ${memoryValue !== 0 ? '1' : '0'}`;
        }

        function appendValue(val) {
            playClickSound();
            if (currentInput === "0" && val !== "." && !isOperator(val)) {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            playClickSound();
            currentInput += " " + op + " ";
            updateDisplay();
        }

        function appendConstant(constantStr) {
            playClickSound();
            if (currentInput === "0") {
                currentInput = constantStr;
            } else {
                currentInput += constantStr;
            }
            updateDisplay();
        }

        function appendFunction(funcName) {
            playClickSound();
            if (currentInput === "0") {
                currentInput = funcName + "(";
            } else {
                currentInput += funcName + "(";
            }
            updateDisplay();
        }

        function clearAll() {
            playClickSound();
            currentInput = "0";
            expressionHistory = "";
            updateDisplay();
        }

        function backspace() {
            playClickSound();
            if (currentInput.length > 1) {
                currentInput = currentInput.trim();
                currentInput = currentInput.substring(0, currentInput.length - 1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function toggleSign() {
            playClickSound();
            if (currentInput.startsWith("-")) {
                currentInput = currentInput.substring(1);
            } else if (currentInput !== "0") {
                currentInput = "-" + currentInput;
            }
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0 || !Number.isInteger(n)) return NaN;
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        // Parser & Calculation Engine
        function calculateResult() {
            playClickSound();
            expressionHistory = currentInput;
            try {
                let evalStr = currentInput;

                // Trig angle handling
                evalStr = evalStr.replace(/sin\(/g, angleMode === 'DEG' ? 'Math.sin((Math.PI/180)*' : 'Math.sin(');
                evalStr = evalStr.replace(/cos\(/g, angleMode === 'DEG' ? 'Math.cos((Math.PI/180)*' : 'Math.cos(');
                evalStr = evalStr.replace(/tan\(/g, angleMode === 'DEG' ? 'Math.tan((Math.PI/180)*' : 'Math.tan(');

                // Inverse trig handling
                evalStr = evalStr.replace(/asin\(/g, angleMode === 'DEG' ? '(180/Math.PI)*Math.asin(' : 'Math.asin(');
                evalStr = evalStr.replace(/acos\(/g, angleMode === 'DEG' ? '(180/Math.PI)*Math.acos(' : 'Math.acos(');
                evalStr = evalStr.replace(/atan\(/g, angleMode === 'DEG' ? '(180/Math.PI)*Math.atan(' : 'Math.atan(');

                // Logs, roots, factorial & powers
                evalStr = evalStr.replace(/log\(/g, 'Math.log10(');
                evalStr = evalStr.replace(/ln\(/g, 'Math.log(');
                evalStr = evalStr.replace(/sqrt\(/g, 'Math.sqrt(');
                evalStr = evalStr.replace(/fact\(/g, 'factorial(');
                evalStr = evalStr.replace(/\^/g, '**');
                evalStr = evalStr.replace(/([0-9.]+)%/g, '($1/100)');

                let result = eval(evalStr);

                if (isNaN(result) || !isFinite(result)) {
                    currentInput = "ERR: SINTAXE";
                } else {
                    result = Math.round(result * 1e10) / 1e10;
                    currentInput = result.toString();
                    addToTape(expressionHistory, currentInput);
                }
            } catch (error) {
                currentInput = "ERR: ERRO";
            }
            updateDisplay();
        }

        function isOperator(char) {
            return ['+', '-', '*', '/', '^'].includes(char);
        }

        // Memory Operations
        function memoryOp(op) {
            playClickSound();
            let val = parseFloat(currentInput) || 0;
            switch(op) {
                case 'MC':
                    memoryValue = 0;
                    break;
                case 'M+':
                    memoryValue += val;
                    break;
                case 'MR':
                    currentInput = memoryValue.toString();
                    break;
                case 'MS':
                    memoryValue = val;
                    break;
            }
            updateDisplay();
        }

        // History Tape Drawer Controls
        function toggleHistoryTape() {
            playClickSound();
            const tape = document.getElementById('historyTapeContainer');
            tape.classList.toggle('hidden');
        }

        function addToTape(expr, res) {
            historyTape.unshift({ expr, res });
            if (historyTape.length > 20) historyTape.pop();
            renderTape();
        }

        function renderTape() {
            const list = document.getElementById('historyTapeList');
            if (historyTape.length === 0) {
                list.innerHTML = '<div class="text-zinc-600 italic">Nenhum cálculo na fita...</div>';
                return;
            }
            list.innerHTML = historyTape.map(item => `
                <div class="flex justify-between border-b border-zinc-800/60 py-0.5">
                    <span class="opacity-75">${item.expr}</span>
                    <span class="font-bold text-amber-400">= ${item.res}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            playClickSound();
            historyTape = [];
            renderTape();
        }

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if ((key >= '0' && key <= '9') || key === '.') {
                appendValue(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '^') {
                appendOperator(key);
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                calculateResult();
            } else if (key === 'Backspace') {
                e.preventDefault();
                backspace();
            } else if (key.toLowerCase() === 'c') {
                clearAll();
            } else if (key === '(' || key === ')') {
                appendValue(key);
            }
        });
    </script>
</body>
